lty:"Novice",points:130,aiOverview:"First JS: const declaration, function definition, template literal, call.",lineDescriptions:{},fragments:[{id:"j1",text:'const planet = "Orbital";',order:0},{id:"j2",text:"function launch() {",order:1},{id:"j3",text:"  console.log(`Hello ${planet}`);",order:2},{id:"j4",text:"}",order:3},{id:"j5",text:"launch();",order:4},{id:"jd1",text:"print(planet)",order:-1,decoy:!0},{id:"jd2",text:"const planet = Orbital;",order:-1,decoy:!0}],quiz:{q:"Call function?",options:["launch","launch()","call launch"],answer:1,explain:"Parentheses execute function."},hints:["Declare then define then call","Template string uses backticks"]},{id:"js-todo",title:"To-Do List App",lang:"js",desc:"Intermediate to-do with array, DOM, events — orbital task manager.",lines:"14 LINES",lineCount:14,difficulty:"Intermediate",points:250,aiOverview:"To-Do expert: todos array stores strings. addTodo gets input, pushes, clears, renders. renderTodos uses getElementById + map+join to create <li>. addEventListener click binds button. Edge: trim check prevents empty, innerHTML rewrite is simple but not optimal for large lists.",lineDescriptions:{"let todos = [];":"Array stores tasks — let allows reassignment, [] empty init","function addTodo() {":"Function to add task","  const input = document.getElementById('todoInput');":"Gets input DOM node — getElementById is fastest selector","  if (!input.value.trim()) return;":"Guard: ignore empty — trim removes spaces","  todos.push(input.value);":"Array push adds to end — mutates array","  input.value = '';":"Clear input after add","  renderTodos();":"Re-render list","}":"Close addTodo","function renderTodos() {":"Render function","  const list = document.getElementById('todoList');":"Get UL container","  list.innerHTML = todos.map(t => `<li>${t}</li>`).join('');":"Map each todo to <li>, join to string — map is functional, join removes commas","document.getElementById('addBtn').addEventListener('click', addTodo);":"Event listener — binds click to addTodo, no () because reference","renderTodos();":"Initial render call"},fragments:[{id:"td1",text:"let todos = [];",order:0,help:{explain:"Array to hold todos. let allows push.",mistake:"const [] still works for push, but let clearer",example:"let todos = []; // empty orbital list"}},{id:"td2",text:"function addTodo() {",order:1,help:{explain:"Defines add function.",mistake:"Arrow function also works but need function for hoisting",example:"function addTodo() { ... }"}},{id:"td3",text:"  const input = document.getElementById('todoInput');",order:2,help:{explain:"Gets input element. Common DOM API.",mistake:"querySelector needs # prefix",example:"document.getElementById('todoInput')"}},{id:"td4",text:"  if (!input.value.trim()) return;",order:3,help:{explain:"Prevents empty todos — trim removes whitespace.",mistake:"Without trim, spaces count as todo",example:"if (!input.value.trim()) return; // guard"}},{id:"td5",text:"  todos.push(input.value);",order:4,help:{explain:"Push adds to array end. Mutates.",mistake:"todos = input.value overwrites array",example:"todos.push(input.value); → array push"}},{id:"td6",text:"  input.value = '';",order:5},{id:"td7",text:"  renderTodos();",order:6,help:{explain:"Calls render after push.",mistake:"Forgetting to re-render leaves UI stale",example:"renderTodos(); // update UI"}},{id:"td8",text:"}",order:7},{id:"td9",text:"function renderTodos() {",order:8},{id:"td10",text:"  const list = document.getElementById('todoList');",order:9},{id:"td11",text:"  list.innerHTML = todos.map(t => `<li>${t}</li>`).join('');",order:10,help:{explain:"Map transforms array to HTML strings, join merges. Template literal with ${t}.",mistake:"Forgetting join leaves commas between <li>",example:"todos.map(t => `<li>${t}</li>`).join('')"}},{id:"td12",text:"}",order:11},{id:"td13",text:"document.getElementById('addBtn').addEventListener('click', addTodo);",order:12,help:{explain:"Binds click event. addTodo without () = reference, with () = immediate call.",mistake:"addTodo() would call immediately, not on click",example:"addEventListener('click', addTodo)"}},{id:"td14",text:"renderTodos();",order:13},{id:"td_d1",text:"alert('wrong')",order:-1,decoy:!0},{id:"td_d2",text:"todos.pop()",order:-1,decoy:!0},{id:"td_d3",text:"todos = [];",order:-1,decoy:!0}],quiz:{q:"Why push over assignment?",options:["push adds to array, assignment overwrites","Same","push deletes"],answer:0,explain:"todos.push adds element, todos = value overwrites whole array."},quizzes:[{q:"Why push over assignment?",options:["push adds to array, assignment overwrites","Same","push deletes"],answer:0,explain:"push mutates and adds, = overwrites."},{q:"addEventListener second arg?",options:["addTodo() call","addTodo reference","string"],answer:1,explain:"Pass reference addTodo, not call addTodo(). Call would execute immediately."},{q:"map + join purpose?",options:["Sort","Transform array to HTML string without commas","Delete"],answer:1,explain:"map to <li> strings, join removes default comma separators."}],hints:["Array push adds, = overwrites — think orbital cargo","addEventListener needs function reference not call","map creates new array of HTML, join merges","Trim prevents empty tasks"]},{id:"js-weather",title:"Weather App",lang:"js",desc:"Expert async weather — fetch, API, try/catch, orbital forecast.",lines:"16 LINES",lineCount:16,difficulty:"Expert",points:350,aiOverview:"Weather expert: async function allows await. try/catch handles network errors. fetch calls external API with template literal url including apiKey and city. res.ok checks HTTP status, json() parses. DOM innerText updates temp and description. addEventListener binds search. Edge: API key exposed in frontend is insecure — use backend proxy in production.",lineDescriptions:{"const apiKey = 'YOUR_API_KEY';":"API key placeholder — never expose real key in production","async function getWeather() {":"Async enables await inside — required for fetch","  try {":"Tr
