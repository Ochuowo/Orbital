d task","  const input = document.getElementById('todoInput');":"Gets input DOM node — getElementById is fastest selector","  if (!input.value.trim()) return;":"Guard: ignore empty — trim removes spaces","  todos.push(input.value);":"Array push adds to end — mutates array","  input.value = '';":"Clear input after add","  renderTodos();":"Re-render list","}":"Close addTodo","function renderTodos() {":"Render function","  const list = document.getElementById('todoList');":"Get UL container","  list.innerHTML = todos.map(t => `<li>${t}</li>`).join('');":"Map each todo to <li>, join to string — map is functional, join removes commas","document.getElementById('addBtn').addEventListener('click', addTodo);":"Event listener — binds click to addTodo, no () because reference","renderTodos();":"Initial render call"},fragments:[{id:"td1",text:"let todos = [];",order:0,help:{explain:"Array to hold todos. let allows push.",mistake:"const [] still works for push, but let clearer",example:"let todos = []; // empty orbital list"}},{id:"td2",text:"function addTodo() {",order:1,help:{explain:"Defines add function.",mistake:"Arrow function also works but need function for hoisting",example:"function addTodo() { ... }"}},{id:"td3",text:"  const input = document.getElementById('todoInput');",order:2,help:{explain:"Gets input element. Common DOM API.",mistake:"querySelector needs # prefix",example:"document.getElementById('todoInput')"}},{id:"td4",text:"  if (!input.value.trim()) return;",order:3,help:{explain:"Prevents empty todos — trim removes whitespace.",mistake:"Without trim, spaces count as todo",example:"if (!input.value.trim()) return; // guard"}},{id:"td5",text:"  todos.push(input.value);",order:4,help:{explain:"Push adds to array end. Mutates.",mistake:"todos = input.value overwrites array",example:"todos.push(input.value); → array push"}},{id:"td6",text:"  input.value = '';",order:5},{id:"td7",text:"  renderTodos();",order:6,help:{explain:"Calls render after push.",mistake:"Forgetting to re-render leaves UI stale",example:"renderTodos(); // update UI"}},{id:"td8",text:"}",order:7},{id:"td9",text:"function renderTodos() {",order:8},{id:"td10",text:"  const list = document.getElementById('todoList');",order:9},{id:"td11",text:"  list.innerHTML = todos.map(t => `<li>${t}</li>`).join('');",order:10,help:{explain:"Map transforms array to HTML strings, join merges. Template literal with ${t}.",mistake:"Forgetting join leaves commas between <li>",example:"todos.map(t => `<li>${t}</li>`).join('')"}},{id:"td12",text:"}",order:11},{id:"td13",text:"document.getElementById('addBtn').addEventListener('click', addTodo);",order:12,help:{explain:"Binds click event. addTodo without () = reference, with () = immediate call.",mistake:"addTodo() would call immediately, not on click",example:"addEventListener('click', addTodo)"}},{id:"td14",text:"renderTodos();",order:13},{id:"td_d1",text:"alert('wrong')",order:-1,decoy:!0},{id:"td_d2",text:"todos.pop()",order:-1,decoy:!0},{id:"td_d3",text:"todos = [];",order:-1,decoy:!0}],quiz:{q:"Why push over assignment?",options:["push adds to array, assignment overwrites","Same","push deletes"],answer:0,explain:"todos.push adds element, todos = value overwrites whole array."},quizzes:[{q:"Why push over assignment?",options:["push adds to array, assignment overwrites","Same","push deletes"],answer:0,explain:"push mutates and adds, = overwrites."},{q:"addEventListener second arg?",options:["addTodo() call","addTodo reference","string"],answer:1,explain:"Pass reference addTodo, not call addTodo(). Call would execute immediately."},{q:"map + join purpose?",options:["Sort","Transform array to HTML string without commas","Delete"],answer:1,explain:"map to <li> strings, join removes default comma separators."}],hints:["Array push adds, = overwrites — think orbital cargo","addEventListener needs function reference not call","map creates new array of HTML, join merges","Trim prevents empty tasks"]},{id:"js-weather",title:"Weather App",lang:"js",desc:"Expert async weather — fetch, API, try/catch, orbital forecast.",lines:"16 LINES",lineCount:16,difficulty:"Expert",points:350,aiOverview:"Weather expert: async function allows await. try/catch handles network errors. fetch calls external API with template literal url including apiKey and city. res.ok checks HTTP status, json() parses. DOM innerText updates temp and description. addEventListener binds search. Edge: API key exposed in frontend is insecure — use backend proxy in production.",lineDescriptions:{"const apiKey = 'YOUR_API_KEY';":"API key placeholder — never expose real key in production","async function getWeather() {":"Async enables await inside — required for fetch","  try {":"Try block for errors","    const city = document.getElementById('cityInput').value;":"Get city input","    const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}`;":"Template literal builds URL with variables — backticks allow ${}","    const res = await fetch(url);":"Fetch returns Promise, await waits — fetch is browser API","    if (!res.ok) throw new Error('City not found');":"Check HTTP ok — throw triggers catch","    const data = await res.json();":"Parse JSON — second await","    document.getElementById('temp').innerText = data.current.temp_c + '°C';":"Update temp DOM","    document.getElementById('desc').innerText = data.current.condition.text;":"Update description","  } catch (err) {":"Catch errors","    console.error(err);":"Log error","    alert('Failed to fetch weather');":"User feedback","  }":"Close catch","}":"Close function","document.getElementById('searchBtn').addEventListener('click', getWeather);":"Bind search button"},fragments:[{id:"w1",text:"const apiKey = 'YOUR_API_KEY';",order:0,help:{explain:"Placeholder key. In production, hide via env or backend proxy.",mistake:"Hardcoding real key exposes to users",example:"const apiKey = 'YOUR_API_KEY';"}},{id:"w2",text:"async function getWeather() {",order:1,help:{explain:"async keyword allows await inside.",mistake:"Without async, await is syntax error",example:"async function getWeather() { const res = await fetch... }"}},{id:"w3",text:"  try {",order:2},{id:"w4",text:"    const city = document.getElementById('cityInput').value;",order:3},{id:"w5",text:"    const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}`;",order:4,help:{explain:"Backticks create template literal with ${var} interpolation.",mistake:"Using single quotes loses interpolation",example:"`...${apiKey}...${city}`"}},{id:"w6",text:"    const res = await fetch(url);",order:5,help:{explain:"fetch returns Promise, await pauses until resolved.",mistake:"Forgetting await gives Promise not Response",example:"const res = await fetch(url);"}},{id:"w7",text:"    if (!res.ok) throw new Error('City not found');",order:6,help:{explain:"res.ok false for 404/500. throw jumps to catch.",mistake:"Not checking ok shows broken data silently",example:"if (!res.ok) throw new Error(...)"}},{id:"w8",text:"    const data = await res.json();",order:7},{id:"w9",text:"    document.getElementById('temp').innerText = data.current.temp_c + '°C';",order:8},{id:"w10",text:"    document.getElementById('desc').innerText = data.current.condition.text;",order:9},{id:"w11",text:"  } catch (err) {",order:10},{id:"w12",text:"    console.error(err);",order:11},{id:"w13",text:"    alert('Failed to fetch weather');",order:12},{id:"w14",text:"  }",order:13},{id:"w15",text:"}",order:14},{id:"w16",text:"document.getElementById('searchBtn').addEventListener('click', getWeather);",order:15},{id:"w_d1",text:"fetch(url).then(res => res.json())",order:-1,decoy:!0},{id:"w_d2",text:"const city = 'London';",order:-1,decoy:!0},{id:"w_d3",text:"document.getElementById('temp').value",order:-1,decoy:!0}],quiz:{q:"Why async/await?",options:["Faster","Handles Promises readably, wait for fetch","Required for DOM"],answer:1,explain:"async/await makes asynchronous fetch code read like sync, easier than .then chains."},quizzes:[{q:"Why async/await?",options:["Faster","Handles Promises readably, wait for fetch","Required for DOM"],answer:1,explain:"async/await for Promises, fetch returns Promise."},{q:"fetch without await?",options:["Returns Response immediately","Returns Promise, not data","Throws"],answer:1,explain:"fetch is async, returns Promise. Need await to get Response."},{q:"Why template literal for URL?",options:["Prettier","Allows ${var} interpolation","Faster"],answer:1,explain:"Backticks with ${} embed apiKey and city dynamically."}],hints:["Async needed for await — fetch is Promise","Template literal with backticks for ${city}","Check res.ok before json — throw on error","Try/catch wraps network failures"]}],python:[{id:"py-tictactoe",title:"Tic-Tac-Toe Game",lang:"python",desc:"Beginner tic-tac-toe — 2D list board, print_board with join, check_winner rows/cols/diagonals, loop input row col, toggle X/O. Orbital game.",lines:"30 LINES",lineCount:30,difficulty:"Novice",points:200,aiOverview:`Tic-Tac-Toe Beginner: board = [[' ']*3 for _ in range(3)] creates 3x3 2D list with spaces. print_board loops rows, prints " | ".join(row) and dash separator. check_winner checks rows: if row[0]==row[1]==row[2] != ' ' return winner, cols: board[0][col]==board[1][col]==board[2][col], diagonals: [0][0]==[1][1]==[2][2] and [0][2]==[1][1]==[2][0]. tic_tac_toe initializes board and player X, while True infinite game loop, print_board, input f"Player {player} (row col): ", r,c = map(int, move.split()) parses two ints, board[r][c]=player places mark, winner = check_winner, if winner prints Winner and break, else toggle player O if X else X. Finally tic_tac_toe() call starts.`,lineDescriptions:{"def print_board(board):":"Defines print_board function — takes board 2D list, prints each row with separator","  for row in board:":"Loops each row in board — row is list of 3 cells","    print(' | '.join(row))":"Joins row cells with ' | ' — prints like 'X | O |  '","    print('-' * 5)":"Prints dash line 5 times — visual separator between rows","def check_winner(board):":"Defines check_winner — returns X/O if win else None","  for row in board:":"Checks each row for win","    if row[0] == row[1] == row[2] != ' ':":"Row win condition — all three same and not empty space","      return row[0]":"Returns winning mark from row","  for col in range(3):":"Loops columns 0,1,2 for vertical win check","    if board[0][col] == board[1][col] == board[2][col] != ' ':":"Column win — same mark vertically and not space","      return board[0][col]":"Returns winner from column","  if board[0][0] == board[1][1] == board[2][2] != ' ':":"Diagonal win top-left to bottom-right","    return board[0][0]":"Returns diagonal winner","  if board[0][2] == board[1][1] == board[2][0] != ' ':":"Anti-diagonal win top-right to bottom-left","    return board[0][2]":"Returns anti-diagonal winner","  return None":"No winner yet — returns None","def tic_tac_toe():":"Main game function — sets up board and loop","  board = [[' ']*3 for _ in range(3)]":"Creates 3x3 board 2D list — [[' ']*3 for _ in range(3)] comprehension, spaces as empty cells","  player = 'X'":"Initial player X — will toggle to O","  while True:":"Infinite game loop until break on win","    print_board(board)":"Calls print_board each turn to show current board",'    move = input(f"Player {player} (row col): ")':'Input with f-string — asks Player X/O for row col, e.g. "0 1"',"    r, c = map(int, move.split())":"Parses input — split by space, map to int, r row c column","    board[r][c] = player":"Places player mark at board[r][c] — mutates board","    winner = check_winner(board)":"Checks winner after move — calls check_winner","    if winner:":"If winner exists",'      print(f"Winner: {winner}!")':"Prints winner with f-string — Winner: X!","      break":"Breaks loop — ends game","    player = 'O' if player == 'X' else 'X'":"Toggles player — ternary: O if X else X","tic_tac_toe()":"Starts game — calls tic_tac_toe function"},fragments:[{id:"ttt1",text:"def print_board(board):",order:0,help:{explain:"Defines function to display board — takes 2D list",mistake:"Missing colon causes SyntaxError",example:"def print_board(board):"}},{id:"ttt2",text:"  for row in board:",order:1,help:{explain:"Loops rows in board — each row is list of 3 cells",mistake:"for row in board without colon fails",example:"for row in board:"}},{id:"ttt3",text:"    print(' | '.join(row))",order:2,help:{explain:"Joins row with ' | ' — shows board like X | O",mistake:"Using + instead of join leaves no separator",example:"' | '.join(row)"}},{id:"ttt4",text:"    print('-' * 5)",order:3,help:{explain:"Prints dash separator 5 times — visual row divider",mistake:"Without *5 only one dash",example:"print('-' * 5)"}},{id:"ttt5",text:"def check_winner(board):",order:4,help:{explain:"Function to detect win — checks rows/cols/diagonals",mistake:"Missing board param leads to NameError",example:"def check_winner(board):"}},{id:"ttt6",text:"  for row in board:",order:5,help:{explain:"Row win check loop",mistake:"for col instead of row would miss row wins",example:"for row in board:"}},{id:"ttt7",text:"    if row[0] == row[1] == row[2] != ' ':",order:6,help:{explain:"Row win: three equal and not space ' ' — != ' ' ensures not empty",mistake:"Forgetting != ' ' would treat empty row as win",example:"if row[0]==row[1]==row[2] != ' ':"}},{id:"ttt8",text:"      return row[0]",order:7},{id:"ttt9",text:"  for col in range(3):",order:8,help:{explain:"Column loop 0-2 — checks vertical wins",mistake:"range(2) only checks 2 cols",example:"for col in range(3):"}},{id:"ttt10",text:"    if board[0][col] == board[1][col] == board[2][col] != ' ':",order:9,help:{explain:"Column win condition — same col across rows",mistake:"Using board[col][0] swaps row/col",example:"board[0][col]==board[1][col]==board[2][col] != ' '"}},{id:"ttt11",text:"      return board[0][col]",order:10},{id:"ttt12",text:"  if board[0][0] == board[1][1] == board[2][2] != ' ':",order:11,help:{explain:"Diagonal top-left to bottom-right win",mistake:"Missing [1][1] center misses diagonal",example:"board[0][0]==board[1][1]==board[2][2] != ' '"}},{id:"ttt13",text:"    return board[0][0]",order:12},{id:"ttt14",text:"  if board[0][2] == board[1][1] == board[2][0] != ' ':",order:13,help:{explain:"Anti-diagonal top-right to bottom-left",mistake:"Using [0][0] instead of [0][2] checks wrong diagonal",example:"board[0][2]==board[1][1]==board[2][0] != ' '"}},{id:"ttt15",text:"    return board[0][2]",order:14},{id:"ttt16",text:"  return None",order:15,help:{explain:"No winner returns None — loop continues",mistake:"Returning False would still be falsy but None is conventional",example:"return None"}},{id:"ttt17",text:"def tic_tac_toe():",order:16,help:{explain:"Main game function",mistake:"Missing parentheses",example:"def tic_tac_toe():"}},{id:"ttt18",text:"  board = [[' ']*3 for _ in range(3)]",order:17,help:{explain:"2D list comprehension — [[' ']*3 for _ in range(3)] creates 3x3 grid of spaces",mistake:"[[' ']*3]*3 creates shared references",example:"[[' ']*3 for _ in range(3)]"}},{id:"ttt19",text:"  player = 'X'",order:18,help:{explain:"Starts with X — player variable tracks turn",mistake:"player = X without quotes NameError",example:"player = 'X'"}},{id:"ttt20",text:"  while True:",order:19,help:{explain:"Infinite loop until break on winner",mistake:"while true lowercase fails — True uppercase in Python",example:"while True:"}},{id:"ttt21",text:"    print_board(board)",order:20,help:{explain:"Shows board each turn",mistake:"print(board) would show list not formatted",example:"print_board(board)"}},{id:"ttt22",text:'    move = input(f"Player {player} (row col): ")',order:21,help:{explain:"f-string input prompt with player variable",mistake:"input('Player {player}') without f loses variable",example:'input(f"Player {player} (row col): ")'}},{id:"ttt23",text:"    r, c = map(int, move.split())",order:22,help:{explain:"Parses two ints from inpu ake:"Using random without import NameError",example:"import random"}},{id:"cb2",text:"responses = {",order:1},{id:"cb3",text:"  'hello': ['Hi there!', 'Hello!', 'Hey!'],",order:2,help:{explain:"List of replies for 'hello' key.",mistake:"Missing brackets makes string not list",example:"'hello': ['Hi','Hey']"}},{id:"cb4",text:"  'how are you': ['I am good!', 'Doing well!']",order:3},{id:"cb5",text:"}",order:4},{id:"cb6",text:"def chatbot():",order:5,help:{explain:"def with colon, indented block follows.",mistake:"def chatbot() without colon SyntaxError",example:"def chatbot():"}},{id:"cb7",text:"  print('Bot: Hello! Ask me something')",order:6},{id:"cb8",text:"  while True:",order:7,help:{explain:"while True infinite until break.",mistake:"while true lowercase true works, but True uppercase is Python",example:"while True:"}},{id:"cb9",text:"    user = input('You: ').lower()",order:8,help:{explain:"input() reads, .lower() normalizes to lowercase.",mistake:"Without lower, Bye != bye",example:"input('You: ').lower()"}},{id:"cb10",text:"    if user == 'bye':",order:9},{id:"cb11",text:"      print('Bot: Goodbye!')",order:10},{id:"cb12",text:"      break",order:11,help:{explain:"break exits nearest loop.",mistake:"Using exit() kills program abruptly",example:"break"}},{id:"cb13",text:"    for key in responses:",order:12},{id:"cb14",text:"      if key in user:",order:13,help:{explain:"Checks if key substring in user string.",mistake:"if user == key requires exact match, less flexible",example:"if key in user:"}},{id:"cb15",text:'        print(f"Bot: {random.choice(responses[key])}")',order:14,help:{explain:"random.choice picks random reply, f-string formats.",mistake:"random.choice without list fails",example:'f"Bot: {random.choice(responses[key])}"'}},{id:"cb_d1",text:"import time",order:-1,decoy:!0},{id:"cb_d2",text:"if user = 'bye':",order:-1,decoy:!0},{id:"cb_d3",text:"print(random.responses)",order:-1,decoy:!0}],quiz:{q:"Why .lower() on input?",options:["Faster","Makes )":"Get SMA series","  if data['Close'].iloc[-1] > sma.iloc[-1]:":"Compare last Close vs last SMA — iloc[-1] last row","    return 'BUY'":"BUY if price above average — uptrend","  else:":"Else downtrend","    return 'SELL'":"SELL signal","data = get_stock_data('AAPL')":"Get AAPL data","signal = trading_signal(data)":"Compute signal","print(f'Trading Signal for AAPL: {signal}')":"Print signal — f-string","# risk: always use paper trading first":"Risk note — paper trading first","# never use real money without backtesting":"Backtest required","# orbital expert module - defensive only":"Defensive educational only"},fragments:[{id:"tr1",text:"import pandas as pd",order:0,help:{explain:"Pandas is data manipulation library, pd alias.",mistake:"Without import, pd undefined",example:"import pandas as pd"}},{id:"tr2",text:"import yfinance as yf",order:1,help:{explain:"yfinance pulls Yahoo Finance data.",mistake:"yfinance not stdlib — needs pip install yfinance",example:"import yfinance as yf"}},{id:"tr3",text:"def get_stock_data(ticker):",order:2},{id:"tr4",text:"  stock = yf.Ticker(ticker)",order:3,help:{explain:"Ticker object represents stock.",mistake:"yf.Ticker without ticker arg fails",example:"yf.Ticker(ticker)"}},{id:"tr5",text:"  hist = stock.history(period='1mo')",order:4,help:{explain:"history(period='1mo') gets 1 month data.",mistake:"period='1m' is 1 minute, not month",example:"stock.history(period='1mo')"}},{id:"tr6",text:"  return hist",order:5},{id:"tr7",text:"def calculate_sma(data, window=20):",order:6,help:{explain:"SMA = Simple Moving Average, window 20 default.",mistake:"window=0 causes division error",example:"def calculate_sma(data, window=20):"}},{id:"tr8",text:"  return data['Close'].rolling(window=window).mean()",order:7,help:{explain:"rolling(window).mean() computes moving average of Close.",mistake:"data.Close without brackets fails if column name has spaces",example:"data['Close'].rolling(window=window).mean()"}},{id:"tr9",text:"def trading_signal(data):",order:8},{id:"tr10",text:"  sma = calculate_sma(data)",order:9},{id:"tr11",text:"  if data['Close'].iloc[-1] > sma.iloc[-1]:",order:10,help:{explain:"iloc[-1] last row — compares price vs average.",mistake:"iloc[-1] vs iloc[0] first row, need last",example:"data['Close'].iloc[-1] > sma.iloc[-1]"}},{id:"tr12",text:"    return 'BUY'",order:11,help:{explain:"BUY when price above SMA — uptrend momentum.",mistake:"Returning buy lowercase breaks comparison",example:"return 'BUY'"}},{id:"tr13",text:"  else:",order:12},{id:"tr14",text:"    return 'SELL'",order:13},{id:"tr15",text:"data = get_stock_data('AAPL')",order:14},{id:"tr16",text:"signal = trading_signal(data)",order:15},{id:"tr17",text:"print(f'Trading Signal for AAPL: {signal}')",order:16},{id:"tr18",text:"# risk: always use paper trading first",order:17,help:{explain:"Risk management — never live trade without paper test.",mistake:"Ignoring risk leads to loss",example:"# risk: paper trading first"}},{id:"tr19",text:"# never use real money without backtesting",order:18},{id:"tr20",text:"# orbital expert module - defensive only",order:19},{id:"tr_d1",text:"data = yf.download('AAPL')",order:-1,decoy:!0},{id:"tr_d2",text:"return 'HOLD'",order:-1,decoy:!0},{id:"tr_d3",text:"import numpy as np",order:-1,decoy:!0}],quiz:{q:"What does rolling(window).mean() do?",options:["Sum","Calculates moving average smoothing price","Deletes"],answer:1,explain:"Rolling mean smooths Close price over window, SMA indicator."},quizzes:[{q:"What does rolling(window).mean() do?",options:["Sum","Calculates moving average smoothing price","Deletes"],answer:1,explain:"SMA smooths, shows trend."},{q:"iloc[-1] means?",options:["First row","Last row","Middle"],answer:1,explain:"iloc[-1] last element, current price."},{q:"BUY signal when?",options:["Close < SMA","Close > SMA (uptrend)","Always"],answer:1,explain:"Price above average indicates uptrend momentum, BUY."}],hints:["Pandas for dataframes, yfinance for Yahoo data","rolling(window).mean() = SMA","iloc[-1] last row current price","Paper trading first — never live without backtest"]}],hacking:[{id:"hack-secure-login",title:"Ethical Hacking Novice",lang:"hacking",desc:"Learn defensive security - Secure Login Form. Ethical Hacking teaches responsible disclosure, defensive security, sandbox only.",lines:"6 LINES",lineCount:6,difficulty:"Novice",points:200,aiOverview:"Secure login teaches autocomplete off, required, hashing.",lineDescriptions:{},fragments:[{id:"eh1",text:'<form autocomplete="off" method="POST">',order:0},{id:"eh2",text:'  <input type="email" autocomplete="username" required />',order:1},{id:"eh3",text:'  <input type="password" autocomplete="current-password" required />',order:2},{id:"eh4",text:'  <button type="submit">Secure Login</button>',order:3},{id:"eh5",text:"</form>",order:4},{id:"eh6",text:"<!-- hash passwords server-side, responsible disclosure -->",order:5},{id:"ehd1",text:'<form autocomplete="on">',order:-1,decoy:!0},{id:"ehd2",text:'  <input type="text" />',order:-1,decoy:!0},{id:"ehd3",text:'password = request.form["password"] // store plain',order:-1,decoy:!0}],quiz:{q:"Core principle of Ethical Hacking?",options:["Exploit silently","Responsible disclosure, defensive security, sandbox only","Bypass auth for speed"],answer:1,explain:"Ethical Hacking is about defensive security, sandbox testing, and responsible disclosure to protect users."},hints:["autocomplete off for sensitive forms","Use username and current-password autocomplete hints","Never store plain passwords - hash server-side with bcrypt","Ethical Hacking = defensive, responsible disclosure"]}],react:[{id:"react1",title:"Auth System - Login/Register/Reset",lang:"react",desc:"Beginner React auth — useState for user/email, register triggers verification, conditional rendering LoginForm vs ConfirmEmail vs WelcomePage, props drilling, logout/reset flow. Welcome to React!",lines:"20 LINES",lineCount:20,difficulty:"Novice",points:300,aiOverview:"React Beginner Auth: useState manages user and email. handleRegister simulates sending confirmation email and sets verified false. handleConfirmEmail flips verified true. handleLogin sets verified true. Conditional rendering: if !user -> LoginForm, if !verified -> ConfirmEmail, else WelcomePage. Props drilling: onRegister, onLogin, onConfirm, onLogout, onReset passed down. handlePasswordReset shows alert. Welcome to React pattern teaches auth flow logic, state, conditional JSX.",lineDescriptions:{"import { useState } from 'react';":"Import useState hook from React — state for auth","function AuthApp() {":"AuthApp component — root for auth flow","  const [user, setUser] = useState(null);":"User state null initially — tracks logged user object","  const [email, setEmail] = useState('');":"Email state empty — input control","  const handleRegister = () => {":"Register handler — starts verification flow","    // send confirmation email":"Comment: simulate sending confirmation email","    setUser({ email, verified: false });":"Set user unverified — needs email confirmation","  };":"Close register","  const handleConfirmEmail = () => {":"Confirm handler — user clicks email link","    setUser({ ...user, verified: true });":"Spread user + verified true — immutable update","  };":"Close confirm","  const handleLogin = () => {":"Login handler — direct login","    setUser({ email, verified: true });":"Set verified true immediately","  };":"Close login","  const handleLogout = () => setUser(null);":"Logout clears user — back to login","  const handlePasswordReset = () => { alert('Reset link sent to ' + email); };":"Password reset — alert simulated reset link","  if (!user) return <LoginForm onRegister={handleRegister} onLogin={handleLogin} />;":"Conditional rendering: no user -> LoginForm with props drilling","  if (!user.verified) return <ConfirmEmail onConfirm={handleConfirmEmail} />;":"If not verified -> ConfirmEmail screen","  return <WelcomePage user={user} onLogout={handleLogout} onReset={handlePasswordReset} />;":"Else WelcomePage with user props, logout and reset callbacks","}":"Close AuthApp component"},fragments:[{id:"r1_1",text:"import { useState } from 'react';",order:0,help:{explain:"useState hook manages auth state",mistake:"Missing import breaks hooks",example:"import { useState } from 'react'"}},{id:"r1_2",text:"function AuthApp() {",order:1,help:{explain:"Root component for auth flow",mistake:"Function name should be PascalCase",example:"function AuthApp() {"}},{id:"r1_3",text:"  const [user, setUser] = useState(null);",order:2,help:{explain:"User state holds {email, verified}",mistake:"useState(null) vs useState() undefined",example:"const [user, setUser] = useState(null)"}},{id:"r1_4",text:"  const [email, setEmail] = useState('');",order:3},{id:"r1_5",text:"  const handleRegister = () => {",order:4},{id:"r1_6",text:"    // send confirmation email",order:5,help:{explain:"Simulate email sending before verified false",mistake:"Forgetting verification step skips confirm screen",example:"// send confirmation email"}},{id:"r1_7",text:"    setUser({ email, verified: false });",order:6,help:{explain:"Register creates unverified user to trigger ConfirmEmail",mistake:"verified: true would skip confirmation",example:"setUser({ email, verified: false })"}},{id:"r1_8",text:"  };",order:7},{id:"r1_9",text:"  const handleConfirmEmail = () => {",order:8},{id:"r1_10",text:"    setUser({ ...user, verified: true });",order:9,help:{explain:"Spread operator keeps email, flips verified",mistake:"Mutating user.verified directly breaks React",example:"{ ...user, verified: true }"}},{id:"r1_11",text:"  };",order:10},{id:"r1_12",text:"  const handleLogin = () => {",order:11},{id:"r1_13",text:"    setUser({ email, verified: true });",order:12},{id:"r1_14",text:"  };",order:13},{id:"r1_15",text:"  const handleLogout = () => setUser(null);",order:14,help:{explain:"Logout resets to null -> LoginForm",mistake:"setUser({}) not null breaks !user check",example:"setUser(null)"}},{id:"r1_16",text:"  const handlePasswordReset = () => { alert('Reset link sent to ' + email); };",order:15,help:{explain:"Reset shows alert with email",mistake:"Using innerHTML for reset is XSS",example:"alert('Reset link sent to ' + email)"}},{id:"r1_17",text:"  if (!user) return <LoginForm onRegister={handleRegister} onLogin={handleLogin} />;",order:16,help:{explain:"Conditional rendering: LoginForm when no user, props drilling register/login",mistake:"Returning div instead of LoginForm loses auth UI",example:"if (!user) return <LoginForm />"}},{id:"r1_18",text:"  if (!user.verified) return <ConfirmEmail onConfirm={handleConfirmEmail} />;",order:17,help:{explain:"Second guard: unverified -> ConfirmEmail",mistake:"Checking verified before !user causes null error",example:"if (!user.verified) return <ConfirmEmail />"}},{id:"r1_19",text:"  return <WelcomePage user={user} onLogout={handleLogout} onReset={handlePasswordReset} />;",order:18,help:{explain:"Final render: WelcomePage with user and callbacks",mistake:"Missing props breaks logout/reset buttons",example:"<WelcomePage user={user} onLogout={handleLogout} />"}},{id:"r1_20",text:"}",order:19},{id:"r1_d1",text:"localStorage.clear()",order:-1,decoy:!0},{id:"r1_d2",text:"window.location.reload()",order:-1,decoy:!0},{id:"r1_d3",text:"  const [password, setPassword] = useState(localStorage.getItem('pw'));",order:-1,decoy:!0},{id:"r1_d4",text:"  useEffect(()=>{ fetch('/api/login') }, [])",order:-1,decoy:!0}],quiz:{q:"What triggers ConfirmEmail screen?",options:["user is null","user exists but verified false after register","Always"],answer:1,explain:"Register sets verified false, so if (!user.verified) renders ConfirmEmail."},quizzes:[{q:"What triggers ConfirmEmail screen?",options:["user is null","user exists but verified false after register","Always"],answer:1,explain:"verified false after register triggers confirm."},{q:"Why spread ...user in confirm?",options:["Deletes email","Keeps email while updating verified — immutable update","Not needed"],answer:1,explain:"{...user, verified:true} preserves email."},{q:"Props drilling in LoginForm?",options:["onRegister and onLogin passed as props","No props","Only style"],answer:0,explain:"LoginForm receives onRegister and onLogin callbacks."}],hints:["Flow: null -> unverified -> verified • useState for user/email","Conditional rendering: if (!user) LoginForm, if (!verified) ConfirmEmail, else WelcomePage","Spread ...user preserves email when verifying","Logout sets null, reset shows alert"]},{id:"react2",title:"E-Commerce Platform",lang:"react",desc:"Intermediate e-commerce — product page mapping, cart state, orders, payment mock Stripe/M-Pesa, admin panel with users/products/orders control. Fully functional orbital shop.",lines:"28 LINES",lineCount:28,difficulty:"Intermediate",points:380,aiOverview:"E-Commerce expert: useState for products array (Hoodie, Mug), cart array, orders array, isAdmin toggle, search filter. addToCart spreads cart + product. checkout creates order {id, items, total via reduce}, pushes to orders, clears cart, alert M-Pesa/Stripe. filtered uses filter + toLowerCase includes search. Conditional admin: if isAdmin return AdminPanel with products/orders/users. Else return ProductPage mapped, Cart with checkout, OrderPage, toggle admin button. AdminPanel table shows control.",lineDescriptions:{"import { useState } from 'react';":"Import useState for shop state","function EcommerceApp() {":"Ecommerce root component","  const [products] = useState([{id:1,name:'Orbital Hoodie',price:3500},{id:2,name:'Code Mug',price:1200}]);":"Products state — static catalog with id/name/price","  const [cart, setCart] = useState([]);":"Cart state empty array","  const [orders, setOrders] = useState([]);":"Orders history","  const [isAdmin, setIsAdmin] = useState(false);":"Admin toggle boolean","  const [search, setSearch] = useState('');":"Search input state","  const addToCart = (p) => setCart([...cart, p]);":"addToCart spreads cart + new product","  const checkout = () => {":"Checkout handler","    const order = { id: Date.now(), items: cart, total: cart.reduce((s,p)=>s+p.price,0) };":"Create order with total via reduce","    setOrders([...orders, order]);":"Push order to orders","    setCart([]);":"Clear cart after checkout","    // payment integration: Stripe mock + M-Pesa":"Payment comment — mock integration","    alert('Payment successful via M-Pesa / Stripe!');":"Alert payment success","  };":"Close checkout","  const filtered = products.filter(p=> p.name.toLowerCase().includes(search.toLowerCase()));":"Filtered products by search","  if (isAdmin) return <AdminPanel products={products} orders={orders} users={['ochuo@orbital.game']} />;":"Admin conditional — returns AdminPanel with props","  return (":"Return shop UI","    <>":"Fragment wrapper","      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder='Search orbital products' />":"Search input","      <ProductPage products={filtered} onAdd={addToCart} />":"ProductPage maps filtered products + onAdd prop","      <Cart cart={cart} onCheckout={checkout} />":"Cart shows cart + checkout button","      <OrderPage orders={orders} />":"OrderPage lists past orders","      <button onClick={()=>setIsAdmin(!isAdmin)}>Toggle Admin</button>":"Toggle admin button","    </>":"Close fragment","  );":"Close return","}":"Close component"},fragments:[{id:"r2_1",text:"import { useState } from 'react';",order:0},{id:"r2_2",text:"function EcommerceApp() {",order:1},{id:"r2_3",text:"  const [products] = useState([{id:1,name:'Orbital Hoodie',price:3500},{id:2,name:'Code Mug',price:1200}]);",order:2,help:{explain:"Products catalog — id name price",mistake:"Mutating products directly loses React state",example:"useState([{id:1,name:...}])"}},{id:"r2_4",text:"  const [cart, setCart] = useState([]);",order:3},{id:"r2_5",text:"  const [orders, setOrders] = useState([]);",order:4},{id:"r2_6",text:"  const [isAdmin, setIsAdmin] = us dd, delete, component composition PostCard/CreatePost, optimistic updates.",lines:"32 LINES",lineCount:32,difficulty:"Expert",points:500,aiOverview:"Social Media expert: posts state array with id/user/content/likes/comments. newPost input state. createPost validates trim, prepends new post {id:Date.now, user You, content newPost, likes 0, comments []} to posts, clears input. likePost maps posts, if id match likes+1. addComment maps, spreads comments + text. deletePost filters out id. Return: social-feed div, composer div with CreatePost component (value, onChange, onPost), feed-list maps posts to PostCard with key, post, onLike, onComment, onDelete props. Component composition like Facebook/Instagram.",lineDescriptions:{"import { useState } from 'react';":"Import useState for feed","function SocialApp() {":"SocialApp root","  const [posts, setPosts] = useState([{id:1,user:'Ochuo',content:'Just launched Orbital! \uD83D\uDE80',likes:12,comments:['Congrats!']}]);":"Posts initial with sample post","  const [newPost, setNewPost] = useState('');":"New post input","  const createPost = () => {":"Create post handler","    if (!newPost.trim()) return;":"Guard empty","    setPosts([{id:Date.now(),user:'You',content:newPost,likes:0,comments:[]},...posts]);":"Prepend new post to feed","    setNewPost('');":"Clear input","  };":"Close create","  const likePost = (id) => {":"Like handler","    setPosts(posts.map(p=> p.id===id ? {...p,likes:p.likes+1} : p));":"Map increment likes","  };":"Close like","  const addComment = (id, text) => {":"Add comment handler","    if (!text.trim()) return;":"Guard empty comment","    setPosts(posts.map(p=> p.id===id ? {...p,comments:[...p.comments,text]} : p));":"Map add comment spread","  };":"Close comment","  const deletePost = (id) => {":"Delete handler","    setPosts(posts.filter(p=>p.id!==id));":"Filter out post","  };":"Close delete","  return (":"Return feed UI","    <div className='social-feed'>":"Social feed container","      <div class         @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        *{font-family: 'Space Grotesk', system-ui, sans-serif}
        .mono{font-family:'JetBrains Mono', monospace}
        @keyframes orbit-rotate{
          from{transform: rotate(0deg) translateX(14px) rotate(0deg)}
          to{transform: rotate(360deg) translateX(14px) rotate(-360deg)}
        }
        @keyframes pulse-glow{
          0%,100%{box-shadow:0 0 20px rgba(124,58,237,0.6), 0 0 40px rgba(124,58,237,0.3)}
          50%{box-shadow:0 0 30px rgba(124,58,237,0.9), 0 0 60px rgba(124,58,237,0.5)}
        }
        @keyframes float{
          0%,100%{transform:translateY(0)}
          50%{transform:translateY(-6px)}
        }
        @keyframes shimmer{
          0%{transform:translateX(-100%)}
          100%{transform:translateX(200%)}
        }
        .glass{
          background: rgba(255,255,255,0.05);
          backdrop-filter: blur(16px);
          border: 1px solid rgba(255,255,255,0.08);
        }
        .glass-strong{
          background: rgba(18,18,35,0.7);
          backdrop-filter: blur(20px);
          border: 1px solid rgba(124,58,237,0.25);
        }
        @keyframes ai-pulse{
          0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0.6), 0 0 24px rgba(245,158,11,0.5)}
          50%{box-shadow:0 0 0 12px rgba(124,58,237,0), 0 0 36px rgba(245,158,11,0.8)}
        }
        .ai-floating-btn{
          position: fixed;
          bottom: 88px;
          right: 16px;
          width: 56px;
          height: 56px;
          border-radius: 9999px;
          background: linear-gradient(135deg, #f59e0b 0%, #7c3aed 50%, #06b6d4 100%);
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 22px;
          font-weight: 700;
          z-index: 60;
          border: 1px solid rgba(255,255,255,0.2);
          cursor: pointer;
          animation: ai-pulse 2.2s infinite;
          transition: transform 0.15s ease;
        }
        .ai-floating-btn:active{transform:scale(0.95)}
        .ai-tutor-panel{
          display: flex;
        }
        @media (max-width: 768px){
          .ai-tutor-panel{
            display: none !important;
          }
          .ai-floating-btn{
            display: flex !important;
          }
        }
        @media (min-width: 769px){
          .ai-floating-btn{
            display: none !important;
          }
        }
        @keyframes slideUp{
          from{transform:translateY(20px); opacity:0}
          to{transform:translateY(0); opacity:1}
        }
        @keyframes speaking-pulse{
          0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.7)}
          50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}
        }
        .speak-btn-speaking{
          background: rgba(239,68,68,0.15) !important;
          border-color: rgba(239,68,68,0.4) !important;
          color: #fca5a5 !important;
          animation: speaking-pulse 1.5s infinite;
        }
        .ai-modal-overlay{
          position: fixed;
          inset: 0;
          z-index: 70;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 16px;
        }
        .ai-modal-backdrop{
          position: absolute;
          inset: 0;
          background: rgba(5,5,16,0.55);
          backdrop-filter: blur(8px);
        }
        .ai-modal-sheet{
          position: relative;
          width: 100%;
          max-width: 520px;
          max-height: 78vh;
          background: rgba(18,18,42,0.96);
          backdrop-filter: blur(24px);
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 24px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          box-shadow: 0 20px 80px rgba(0,0,0,0.6), 0 0 80px rgba(124,58,237,0.35);
          animation: slideUp 0.32s ease;
        }
        .ai-modal-handle{
          width: 36px;
          height: 4px;
          border-radius: 9999px;
          background: rgba(255,255,255,0.2);
          margin: 10px auto 0;
        }
        @media (max-width: 768px){
          .ai-modal-overlay{
            align-items: flex-end;
            justify-content: flex-end;
            padding: 0;
            pointer-events: none;
          }
          .ai-modal-backdrop{
            background: rgba(5,5,16,0.35);
            pointer-events: auto;
          }
          .ai-modal-sheet{
            position: fixed;
            bottom: 88px;
            right: 12px;
            left: 12px;
            width: auto;
            max-width: 380px;
            margin-left: auto;
            margin-right: 0;
            height: 62vh;
            max-height: 500px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.65), 0 0 80px rgba(124,58,237,0.35), 0 0 0 1px rgba(255,255,255,0.08);
            pointer-events: auto;
            transform: translateY(0);
            animation: slideUp 0.34s cubic-bezier(0.16,1,0.3,1);
            border: 1px solid rgba(255,255,255,0.12);
          }
          .ai-modal-sheet::before{
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124,58,237,0.6), transparent);
